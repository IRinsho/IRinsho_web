<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>IRinsho · 云端后台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2312142a'/><text x='16' y='23' font-family='system-ui,sans-serif' font-size='20' font-weight='700' fill='%23e0466f' text-anchor='middle'>I</text></svg>">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<!-- ============ 登录 / 首次设置密码 ============ -->
<div id="gate" class="gate" hidden>
  <div class="gate-card">
    <div class="gate-avatar">
      <img src="/admin/avatar.webp" alt="头像" width="72" height="72"
           onerror="this.onerror=null;this.src='/admin/avatar-fallback.svg'">
      <span class="gate-dot" title="本地服务运行中"></span>
    </div>
    <h1 class="gate-title">IRinsho</h1>
    <p class="gate-sub" id="gateSub">正在检查……</p>

    <form id="gateForm" class="gate-form" autocomplete="off">
      <label class="field">
        <span class="field-label" id="pwLabel">密码</span>
        <input type="password" id="gatePassword" placeholder="至少 6 位" autocomplete="current-password" required>
      </label>

      <label class="field" id="pwConfirmWrap" hidden>
        <span class="field-label">再输一次</span>
        <input type="password" id="gatePassword2" placeholder="确认密码" autocomplete="new-password">
      </label>

      <p class="gate-error" id="gateError" hidden></p>
      <button class="btn btn-primary btn-block" id="gateSubmit" type="submit">登录</button>
    </form>

    <p class="gate-note" id="gateNote"></p>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" class="app" hidden>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-avatar">
        <img src="/admin/avatar.webp" alt="头像" width="44" height="44"
             onerror="this.onerror=null;this.src='/admin/avatar-fallback.svg'">
        <span class="brand-dot" title="本地服务运行中"></span>
      </div>
      <div class="brand-text">
        <strong>IRinsho</strong>
        <em>云端后台</em>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a class="nav-item" href="#/dashboard" data-view="dashboard"><i class="ic">◈</i><span>仪表盘</span></a>

      <div class="nav-group"><span>内容</span></div>
      <a class="nav-item" href="#/notes" data-view="notes"><i class="ic">✎</i><span>笔记</span><b class="pill" id="pillDrafts" hidden></b></a>
      <a class="nav-item" href="#/photos" data-view="photos"><i class="ic">▣</i><span>相册</span></a>
      <a class="nav-item" href="#/videos" data-view="videos"><i class="ic">▶</i><span>视频</span></a>
      <a class="nav-item" href="#/links" data-view="links"><i class="ic">♡</i><span>友链</span></a>

      <div class="nav-group"><span>站点</span></div>
      <a class="nav-item" href="#/config" data-view="config"><i class="ic">⚙</i><span>站点信息</span></a>
      <a class="nav-item" href="#/theme" data-view="theme"><i class="ic">◐</i><span>配色外观</span></a>
      <a class="nav-item" href="#/history" data-view="history"><i class="ic">↺</i><span>历史与恢复</span></a>

      
      
    </nav>

    <div class="sidebar-foot">
      <div class="foot-row">
        <span class="foot-label">项目</span>
        <span class="foot-path" id="footRoot" title="项目路径"></span>
      </div>
      <button class="btn btn-ghost btn-small btn-block" id="btnLogout">退出登录</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btnMenu" title="菜单">☰</button>
      <h2 class="page-title" id="pageTitle">仪表盘</h2>
      <div class="topbar-right">
        <span class="save-state" id="saveState"></span>
        <button class="btn btn-ghost btn-small" id="btnRefresh" title="重新载入数据">↻ 刷新</button>
      </div>
    </header>

    <div class="content" id="view"></div>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<script src="/admin/admin.js"></script>
</body>
</html>
